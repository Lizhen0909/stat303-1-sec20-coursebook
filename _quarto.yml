book:  
  title: "Data Science I with python"
  subtitle: "STAT 303-1-Sec20"
  author: "Lizhen Shi"
  site-url: "https://lizhen0909.github.io/stat303-1-sec20-coursebook/"
  repo-url: "https://github.com/Lizhen0909/stat303-1-sec20-coursebook"
  
  sidebar:
    search: true
    logo: "NU_Stat_logo.png"
    logo-href: "https://statistics.northwestern.edu/"

  chapters:
    - index.qmd
    - part: 'Review of STAT 201: Python Foundations'
      chapters:
        - python_basics.ipynb
        - data_structures.ipynb
    - part: 'Setting Up for Data Science'
      chapters:
        - vscode_setup.ipynb
        - python_venv.ipynb
    - part: 'Core Library Foundations'
      chapters:
        - Reading_data.ipynb
        - pandas_fundamentals.ipynb
        - pandas_intermediate.ipynb
        - numpy_fundamentals.ipynb
        - numpy_pandas_workflow.ipynb
        - href: data_viz_1.ipynb
          text: "Data Visualization I: Single Plots"
        - href: data_viz_2.ipynb
          text: "Data Visualization II: Multi-Panel Figures"
    - part: 'From Messy to Insight'
      chapters:
        - Data_cleaning.ipynb
        - Data_preparation.ipynb
        - Data aggregation.ipynb
        - Data_reshaping.ipynb
        - Data wrangling.ipynb
        # - student_solutions.ipynb
  appendices: 
    - href: Assignment A.ipynb
      text: "Assignment A: Python Foundations"
    - href: Assignment B.ipynb
      text: "Assignment B: Reproducible Project Setup"
    - href: Assignment C.ipynb
      text: "Assignment C: Pandas"
    - href: Assignment D.ipynb
      text: "Assignment D: NumPy"
    - href: Assignment E.ipynb
      text: "Assignment E: Data Visualization"
    - href: Assignment F.ipynb
      text: "Assignment F: Data Cleaning and Preparation"
    - href: Assignment G.ipynb
      text: "Assignment G: Data Wrangling"
    - geospatial_mapping.ipynb
    - Datasets.ipynb
    # - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css





# Preserve saved notebook outputs; examples include intentional errors and live APIs.
execute:
  enabled: false
